name: Poolside CI

on:
  push:
    branches: [main]
    paths:
      - "poolside/**"
      - ".github/workflows/poolside-ci.yml"
  pull_request:
    paths:
      - "poolside/**"
      - ".github/workflows/poolside-ci.yml"

permissions:
  contents: read

concurrency:
  group: poolside-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: poolside
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poolside/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run verify
      - run: npm run test:persistence
      - name: Corpus validation contract (synthetic fixtures; not the held-out gate)
        run: node --test test/capture-validation.test.cjs test/capture-validation-cli.test.cjs
      - run: npm run sbom:check

  package:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: poolside
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poolside/package-lock.json
      - run: npm ci
      - run: npm run package
      - name: Record executable and app archive hashes
        shell: pwsh
        run: node scripts/inspect-release.cjs | Out-File -LiteralPath release-inspection.json -Encoding utf8
      - name: Run the packaged desktop self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Join-Path (Get-Location) 'release\Poolside-win32-x64\Poolside.exe') -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged self-test failed with exit code $($process.ExitCode)." }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poolside-preview-release-evidence
          path: |
            poolside/release-inspection.json
            poolside/docs/SBOM.cdx.json
          if-no-files-found: warn
